<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | Syzygy</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" href="https://raw.githubusercontent.com/Syzygy-Hub/.github/main/brand/assets/icons/syzygy-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="{{title}}">
  <script src="site.js"></script>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Syzygy home">
      <img src="https://raw.githubusercontent.com/Syzygy-Hub/.github/main/brand/assets/icons/syzygy-icon-32.png" width="32" height="32" alt="">
      <span>Syzygy</span>
    </a>
    <nav aria-label="Main">
      {{nav}}
    </nav>
    <div class="scroll-progress" aria-hidden="true"></div>
  </header>
  <main>
    {{content}}
  </main>
  <footer class="site-footer">
    <p>© 2026 Syzygy · Built with Care</p>
  </footer>
</body>
</html>
